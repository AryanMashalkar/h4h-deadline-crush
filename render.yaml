# Render blueprint: one free web service (Docker; API + in-process worker + UI)
# and one free Postgres, same region. Files live in Cloudflare R2 (S3 API).
# Dashboard -> New -> Blueprint -> pick this repo, then fill in the S3_* values.
services:
  - type: web
    name: deadline-crush
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deadline-crush-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: '10'
      - key: WORKER_CONCURRENCY
        value: '2'
      # https://<your-service>.onrender.com, used for the bucket's CORS rule
      - key: PUBLIC_URL
        sync: false
      # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: deadline-crush
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
databases:
  - name: deadline-crush-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
